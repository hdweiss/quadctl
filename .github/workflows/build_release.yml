# Cut a release from a v* tag. The build itself lives in .goreleaser.yaml (PLAN.md 6.4);
# this workflow only decides when it runs and what it is allowed to touch.
name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags starting with 'v', like v1.0.0

permissions:
  contents: read

jobs:
  # A tag that doesn't build, vet, lint and test is not a release. This is the same workflow
  # that runs on every branch, called rather than copied (PLAN.md 6.5).
  verify:
    uses: ./.github/workflows/go.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a release and upload assets
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # GoReleaser builds the changelog from the commits since the previous tag, and
          # derives the version from the tag itself. A shallow clone has neither.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Release
        run: go tool goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
