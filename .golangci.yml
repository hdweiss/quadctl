# golangci-lint configuration (PLAN.md 6.3).
#
# The binary is pinned as a go.mod tool dependency, so CI and local runs agree:
#   go tool golangci-lint run
#
# The set below is the standard linters plus the ones that catch the classes of
# defect TODO.md actually recorded: dropped errors, dead code, and values that
# get built and never used.
version: "2"

# Report everything. The defaults cap each linter at three findings and hide the rest, which
# turns "the build is clean" into a question of how many times you have run it.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errorlint # %v on an error where %w was meant, and type asserts on wrapped errors
    - misspell
    - nilerr # returning nil after checking err != nil
    - unconvert
    - usestdlibvars
    - wastedassign
    - whitespace

  settings:
    errcheck:
      # Print-family calls to stdout are checked nowhere in this codebase and a
      # failed write to a terminal is not actionable.
      exclude-functions:
        - fmt.Fprintf(os.Stdout)
        - fmt.Fprintln(os.Stdout)

  exclusions:
    presets:
      - std-error-handling
    rules:
      # Table-driven tests keep unused fixture fields around deliberately.
      - path: _test\.go
        linters:
          - unused

formatters:
  enable:
    - gofmt
